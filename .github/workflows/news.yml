name: News aktualisieren
# Fetches this week's Forex Factory calendar and saves it as docs/news.json for the app.
on:
  schedule:
    - cron: '30 3 * * 0-5'
    - cron: '30 15 * * 0-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          curl -fsSL -A 'Mozilla/5.0 (BullionMonkey)' https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/ff.json
          jq -e 'type=="array" and length>0' /tmp/ff.json > /dev/null
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source:"https://nfs.faireconomy.media/ff_calendar_thisweek.json",fetchedAt:$t,events:[.[]|{title,country,date,impact,forecast,previous}]}' \
            /tmp/ff.json > docs/news.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json
          git diff --cached --quiet || (git commit -m 'News aktualisiert' && git push)
