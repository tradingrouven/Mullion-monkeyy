name: News aktualisieren
# Fetches this (and, when published, next) week's Forex Factory calendar and saves it as docs/news.json for the app,
# plus docs/gold-news.ics, a calendar with reminders for the USD news that move gold.
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          curl -fsSL -A 'Mozilla/5.0 (BullionMonkey)' https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/ff.json
          jq -e 'type=="array" and length>0' /tmp/ff.json > /dev/null
          # next week, for planning on the weekend (Forex Factory only publishes it some days)
          curl -fsSL -A 'Mozilla/5.0 (BullionMonkey)' https://nfs.faireconomy.media/ff_calendar_nextweek.json -o /tmp/ffn.json \
            && jq -e 'type=="array"' /tmp/ffn.json > /dev/null || echo '[]' > /tmp/ffn.json
          jq -s --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source:"https://nfs.faireconomy.media/ff_calendar_thisweek.json",fetchedAt:$t,events:([.[0][],.[1][]]|unique_by(.title+.date+.country)|map({title,country,date,impact,forecast,previous}))}' \
            /tmp/ff.json /tmp/ffn.json > docs/news.json
          python3 scripts/news_ics.py
      - name: US yields
        continue-on-error: true
        run: python3 scripts/yields.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json docs/gold-news.ics; if [ -f docs/macro.json ]; then git add docs/macro.json; fi
          git diff --cached --quiet || (git commit -m 'News aktualisiert' && git push)
